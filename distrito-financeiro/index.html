<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />
    <meta name="theme-color" content="#f2f2f0" />
    <script>
      try {
        if (localStorage.getItem('distrito_theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#0f1113');
        }
      } catch {
        // O tema claro permanece como alternativa segura.
      }
    </script>
    <meta
      name="description"
      content="Controle financeiro local da Barbearia Distrito."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="icon"
      type="image/jpeg"
      href="/src/assets/barbearia-distrito-logo.jpg"
    />
    <link
      rel="apple-touch-icon"
      href="/src/assets/barbearia-distrito-logo.jpg"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Distrito Financeiro</title>
  </head>
  <body>
    <div class="app-shell">
      <button class="mobile-nav-toggle" type="button" data-action="toggle-mobile-navigation" aria-label="Abrir navegação" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <button class="mobile-nav-backdrop" type="button" data-action="close-mobile-navigation" aria-label="Fechar navegação" hidden></button>
      <aside class="app-navigation" aria-label="Navegação principal">
        <a class="app-brand" href="#dashboard" aria-label="Barbearia Distrito — ir para o resumo">
          <img
            class="app-brand__logo"
            src="/src/assets/barbearia-distrito-logo.jpg"
            alt=""
            width="150"
            height="150"
          />
          <span class="app-brand__text">
            <strong>Financeiro</strong>
            <small>Barbearia Distrito</small>
          </span>
        </a>

        <nav class="primary-navigation">
          <a
            class="navigation-link"
            href="#dashboard"
            data-route="dashboard"
            aria-current="page"
          >
            <svg
              class="navigation-link__icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a
            class="navigation-link"
            href="#entries"
            data-route="entries"
          >
            <svg
              class="navigation-link__icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M8 6h13" />
              <path d="M8 12h13" />
              <path d="M8 18h13" />
              <path d="M3 6h.01" />
              <path d="M3 12h.01" />
              <path d="M3 18h.01" />
            </svg>
            <span>Lançamentos</span>
          </a>
          <a
            class="navigation-link"
            href="#expenses"
            data-route="expenses"
          >
            <svg
              class="navigation-link__icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6 2h12a2 2 0 0 1 2 2v18l-4-2-4 2-4-2-4 2V4a2 2 0 0 1 2-2Z" />
              <path d="M8 7h8" />
              <path d="M8 11h8" />
              <path d="M8 15h5" />
            </svg>
            <span>Despesas</span>
          </a>
          <a
            class="navigation-link"
            href="#catalog"
            data-route="catalog"
          >
            <svg
              class="navigation-link__icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M20.6 13.6 11 23.2 1.8 14V3h11l7.8 7.8a2 2 0 0 1 0 2.8Z" />
              <circle cx="7.5" cy="8.5" r="1.25" />
            </svg>
            <span>Catálogo</span>
          </a>
          <a
            class="navigation-link"
            href="#settings"
            data-route="settings"
            aria-label="Configurações"
          >
            <svg
              class="navigation-link__icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M4 21v-7" />
              <path d="M4 10V3" />
              <path d="M12 21v-9" />
              <path d="M12 8V3" />
              <path d="M20 21v-5" />
              <path d="M20 12V3" />
              <path d="M1 14h6" />
              <path d="M9 8h6" />
              <path d="M17 16h6" />
            </svg>
            <span>Ajustes</span>
          </a>
          <a class="navigation-link" href="#users" data-route="users">
            <svg
              class="navigation-link__icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M20 21a8 8 0 0 0-16 0" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span>Usuários</span>
          </a>
          <div class="sidebar-profile">
            <button
              class="sidebar-profile__trigger"
              type="button"
              data-action="profile-menu"
              aria-label="Abrir opções da conta"
              aria-expanded="false"
              aria-controls="profile-menu-options"
            >
            <span class="sidebar-profile__avatar" data-user-avatar aria-hidden="true">U</span>
            <span class="sidebar-profile__copy">
              <strong data-user-name>Usuário</strong>
              <small data-user-email>email</small>
            </span>
            </button>
            <div id="profile-menu-options" class="sidebar-profile__menu" hidden>
              <button type="button" data-action="open-profile">Meu perfil</button>
              <button type="button" data-action="logout">Sair</button>
            </div>
          </div>
        </nav>
      </aside>

      <div class="app-workspace">
        <main id="app-content" class="app-content" tabindex="-1" aria-live="polite">
          <h2>Página de Resumo</h2>
        </main>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
